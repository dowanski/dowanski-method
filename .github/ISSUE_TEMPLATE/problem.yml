name: Report a method or template problem
description: Share an observed, non-sensitive problem from use.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: |
        Please do not include private conversations, customer data, credentials, or internal paths. Security concerns belong in SECURITY.md's private reporting route, not a public issue.
  - type: input
    id: version
    attributes:
      label: Version and file
      description: Which release and relative template path are affected?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Complete starter / QDI
        - QDI-to-DM handoff
        - Light foundation
        - Standard foundation
        - Governed foundation
        - Installation / packaging
        - Public explanation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the route or instruction have made clear?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Describe the smallest sanitized example. Identify assumptions or uncertain details.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context, if safe to share
      description: Project shape, agent environment, or a suggested correction. No private source is required.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed sensitive information and this is not a private security report.
          required: true
